<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/097d498678.js" crossorigin="anonymous"></script>

  <title>Productly</title>
</head>
<body>
  
  <header>
    <a href="#" class="logo">
      <img src="images/logo.svg" alt="The logo and name of Productly">
    </a>
    <nav>
      <a href="#">Product</a>
      <a href="#">Customers</a>
      <a href="#">Pricing</a>
      <a href="#">Resources</a>
      <a href="#">
        <button class="btn btn__sign-in">Sign in</button>
      </a>
      <a href="#">
        <button class="btn btn__sign-up">Sign up</button>
      </a>
    </nav>
  </header>
  
  <section class="hero">
    <div class="hero__content">
      <h1 class="hero__title">The Design Thinking superpowers</h1>
      <p class="hero__desc">Tools, tutorials, design and innovation experts, all in one place! The most intuitive way to imagine your next user experience.</p>
      <div class="hero__actions">
        <a href="#">
          <button class="btn btn__get-started">Get started</button>
        </a>
        <a href="#" class="hero__watch-video"> <i class="fa-solid fa-play"></i>Watch the video</a>
      </div>
    </div>
    <img src="images/design-thinking.png" alt="Three people jumping of joy, throwing books">
  </section>

</body>
</html>
